name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check:web

      - name: Lint
        run: pnpm lint:web

      - name: Type-check
        run: pnpm typecheck:web

      - name: Run unit tests
        run: pnpm test:web

      - name: Build
        run: pnpm build:web

  api:
    name: API quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://snapflow:snapflow-test-only@127.0.0.1:5432/snapflow
      GUEST_TOKEN_SIGNING_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MODEL_PROVIDER: mock
    services:
      postgres:
        image: postgres:18.1@sha256:bfe50b2b0ddd9b55eadedd066fe24c7c6fe06626185b73358c480ea37868024d
        env:
          POSTGRES_DB: snapflow
          POSTGRES_PASSWORD: snapflow-test-only
          POSTGRES_USER: snapflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapflow -d snapflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/constraints.txt
            apps/api/pyproject.toml

      - name: Show tool versions
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check apps/api

      - name: Lint
        run: python -m ruff check apps/api

      - name: Type-check
        run: python -m mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests

      - name: Run tests with coverage
        run: >-
          python -m pytest apps/api/tests
          --cov=snapflow
          --cov-config=apps/api/pyproject.toml
          --cov-report=term-missing

  contracts:
    name: Contract drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      MODEL_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/constraints.txt
            apps/api/pyproject.toml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          python --version

      - name: Install contract toolchain
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check OpenAPI and generated client drift
        env:
          PYTHON: python
        run: pnpm contracts:check

  e2e:
    name: E2E happy path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://snapflow:snapflow-test-only@127.0.0.1:5432/snapflow
      GUEST_TOKEN_SIGNING_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MODEL_PROVIDER: mock
    services:
      postgres:
        image: postgres:18.1@sha256:bfe50b2b0ddd9b55eadedd066fe24c7c6fe06626185b73358c480ea37868024d
        env:
          POSTGRES_DB: snapflow
          POSTGRES_PASSWORD: snapflow-test-only
          POSTGRES_USER: snapflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapflow -d snapflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/constraints.txt
            apps/api/pyproject.toml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          python --version

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the mock happy path
        run: pnpm test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
