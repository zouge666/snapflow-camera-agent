name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check:web

      - name: Lint
        run: pnpm lint:web

      - name: Type-check
        run: pnpm typecheck:web

      - name: Run unit tests
        run: pnpm test:web

      - name: Build
        run: pnpm build:web

  api:
    name: API quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      MODEL_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/pyproject.toml

      - name: Show tool versions
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check apps/api

      - name: Lint
        run: python -m ruff check apps/api

      - name: Type-check
        run: python -m mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests

      - name: Run tests with coverage
        run: >-
          python -m pytest apps/api/tests
          --cov=snapflow
          --cov-config=apps/api/pyproject.toml
          --cov-report=term-missing

  e2e:
    name: E2E happy path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      MODEL_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/pyproject.toml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          python --version

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the mock happy path
        run: pnpm test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
