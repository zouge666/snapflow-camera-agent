<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Northstar weekly planning notes</title>
  <desc id="description">A clear photographed planning board with three fictional follow-up actions.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20342d" />
      <stop offset="1" stop-color="#101c18" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="1" stop-color="#f2eee3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#08100d" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#desk)" />
  <circle cx="1440" cy="92" r="170" fill="#baff45" opacity="0.12" />
  <circle cx="105" cy="910" r="230" fill="#ff705c" opacity="0.1" />

  <g transform="rotate(-0.8 800 500)" filter="url(#shadow)">
    <rect x="92" y="58" width="1416" height="884" rx="30" fill="url(#paper)" />
    <rect x="92" y="58" width="1416" height="884" rx="30" fill="none" stroke="#ded7c7" stroke-width="3" />

    <g font-family="sans-serif" fill="#13211c">
      <text x="160" y="150" font-size="31" font-weight="700" letter-spacing="6">NORTHSTAR WEEKLY PLANNING</text>
      <text x="160" y="202" font-size="26" fill="#59645f">Reference date: 2026-07-16</text>
      <rect x="1245" y="117" width="190" height="58" rx="29" fill="#13211c" />
      <text x="1340" y="154" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#fffdf6">SYNTHETIC</text>

      <line x1="160" y1="240" x2="1440" y2="240" stroke="#c8c2b4" stroke-width="3" />
      <text x="160" y="294" font-size="21" font-weight="700" letter-spacing="4" fill="#325f50">DECISIONS &amp; FOLLOW-UPS</text>

      <g>
        <rect x="154" y="332" width="1292" height="112" rx="22" fill="#ffffff" stroke="#ddd7ca" stroke-width="2" />
        <circle cx="215" cy="388" r="30" fill="#baff45" />
        <text x="215" y="398" text-anchor="middle" font-size="25" font-weight="800">1</text>
        <text x="275" y="400" font-size="34" font-weight="600">Alex: Send the revised onboarding checklist by Friday.</text>
      </g>

      <g>
        <rect x="154" y="472" width="1292" height="112" rx="22" fill="#ffffff" stroke="#ddd7ca" stroke-width="2" />
        <circle cx="215" cy="528" r="30" fill="#ff705c" />
        <text x="215" y="538" text-anchor="middle" font-size="25" font-weight="800">2</text>
        <text x="275" y="540" font-size="34" font-weight="600">Prepare the support FAQ before the pilot review.</text>
        <text x="1277" y="533" font-size="18" font-weight="700" letter-spacing="2" fill="#a33d31">OWNER?</text>
      </g>

      <g>
        <rect x="154" y="612" width="1292" height="112" rx="22" fill="#ffffff" stroke="#ddd7ca" stroke-width="2" />
        <circle cx="215" cy="668" r="30" fill="#baff45" />
        <text x="215" y="678" text-anchor="middle" font-size="25" font-weight="800">3</text>
        <text x="275" y="680" font-size="34" font-weight="600">Mina: Book a 30-minute pilot review on 2026-07-22.</text>
      </g>

      <line x1="160" y1="770" x2="1440" y2="770" stroke="#c8c2b4" stroke-width="3" />
      <text x="160" y="824" font-size="21" font-weight="700" letter-spacing="4" fill="#325f50">NOTES</text>
      <circle cx="171" cy="866" r="5" fill="#ff705c" />
      <text x="193" y="875" font-size="27">Pilot group: 8 people</text>
      <circle cx="664" cy="866" r="5" fill="#ff705c" />
      <text x="686" y="875" font-size="27">Keep the first session to 30 minutes</text>
    </g>
  </g>
</svg>
