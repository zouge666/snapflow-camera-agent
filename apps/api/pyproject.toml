[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapflow-api"
version = "0.0.0"
description = "SnapFlow API"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "alembic==1.18.1",
  "fastapi==0.128.0",
  "langgraph==1.0.6",
  "psycopg[binary]==3.3.2",
  "pydantic==2.12.5",
  "python-dotenv==1.2.1",
  "sqlalchemy==2.0.45",
  "uvicorn==0.40.0",
]

[project.optional-dependencies]
test = [
  "coverage==7.13.1",
  "httpx==0.28.1",
  "icalendar==6.3.2",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.13",
  "types-icalendar==6.3.2.20251222",
  "types-python-dateutil==2.9.0.20251115",
  "types-pytz==2025.2.0.20251108",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
  "integration: exercises app composition or an HTTP boundary",
  "unit: runs without HTTP, database, or provider boundaries",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["snapflow"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
ignore = []
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
