[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapflow-api"
version = "0.0.0"
description = "SnapFlow API"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.139.1",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
  "sqlalchemy==2.0.52",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "coverage==7.15.2",
  "httpx2==2.7.0",
  "icalendar==7.2.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
  "integration: exercises app composition or an HTTP boundary",
  "unit: runs without HTTP, database, or provider boundaries",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["snapflow"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
ignore = []
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
