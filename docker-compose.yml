name: snapflow-local

services:
  postgres:
    image: postgres:18.1@sha256:bfe50b2b0ddd9b55eadedd066fe24c7c6fe06626185b73358c480ea37868024d
    environment:
      POSTGRES_DB: snapflow
      POSTGRES_PASSWORD: snapflow-local-only
      POSTGRES_USER: snapflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: infra/docker/api.dev.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://snapflow:snapflow-local-only@postgres:5432/snapflow
      GUEST_TOKEN_SIGNING_KEY: ${GUEST_TOKEN_SIGNING_KEY:?Set GUEST_TOKEN_SIGNING_KEY in .env}
      MODEL_PROVIDER: mock
      RUN_TTL_HOURS: 24
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    init: true
    ports:
      - target: 8000
        published: "8000"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./apps/api/src
        target: /workspace/apps/api/src
        read_only: true

volumes:
  postgres_data:
